dependencies {
    api "com.badlogicgames.gdx:gdx:${providers.gradleProperty('gdxVersion').get()}"

    // LAN PvP (Phase 1) uses plain java.net.Socket + java.io.ObjectOutputStream/
    // ObjectInputStream (see network/PvPConnection.java) -- no networking
    // library dependency needed. An earlier version of this used KryoNet;
    // see DESIGN.md's networking notes for why that was replaced.

    testImplementation platform("org.junit:junit-bom:${providers.gradleProperty('junitVersion').get()}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:${providers.gradleProperty('gdxVersion').get()}:natives-desktop"
}

tasks.named('test') {
    // The sprite checks read the shipped PNGs; replacing artwork must invalidate cached results.
    inputs.files(rootProject.fileTree('assets/operatives') { include '**/*-keyed.png' })
    inputs.files(rootProject.fileTree('assets/adversaries') { include '**/*-keyed.png' })
    inputs.files(rootProject.fileTree('assets/props/chest') { include '**/*-keyed.png' })
}
